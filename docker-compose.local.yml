services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-airtime}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-airtime}
      POSTGRES_DB: ${POSTGRES_DB:-airtime}
    ports:
      - "${PG_PORT:-5432}:5432"
    volumes:
      - airtime-local-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-airtime} -d ${POSTGRES_DB:-airtime}"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  airtime-local-pgdata:
