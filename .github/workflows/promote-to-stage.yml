# Promote dev to stage. Pushes with the promote deploy key (secret PROMOTE_DEPLOY_KEY,
# created by setup-project): the only key the factory-promotion ruleset lets update stage.
name: Promote to stage

on:
  workflow_dispatch:

jobs:
  promote:
    uses: atakumi-global/factory-ci/.github/workflows/promote.yml@v1
    with:
      source: dev
      target: stage
      environment: stage
    secrets:
      deploy_key: ${{ secrets.PROMOTE_DEPLOY_KEY }}
    permissions:
      contents: write
      checks: read
      statuses: read
