# Promote stage to prod. The "prod" environment requires the owner's approval.
# Pushes with the promote deploy key (secret PROMOTE_DEPLOY_KEY, created by
# setup-project): the only key the factory-promotion ruleset lets update prod.
name: Promote to prod

on:
  workflow_dispatch:

jobs:
  promote:
    uses: atakumi-global/factory-ci/.github/workflows/promote.yml@v1
    with:
      source: stage
      target: prod
      environment: prod
    secrets:
      deploy_key: ${{ secrets.PROMOTE_DEPLOY_KEY }}
    permissions:
      contents: write
      checks: read
      statuses: read
