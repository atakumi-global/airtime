# glib 0.18 unsoundness in VariantStrIter. Pulled in only by gtk 0.18 (Tauri's Linux
# window layer: muda, tao). The desktop app ships for Windows, where gtk/glib are not
# compiled. Fixed in glib 0.20, which needs a Tauri release on gtk-rs 0.20.
[[IgnoredVulns]]
id = "RUSTSEC-2024-0429"
ignoreUntil = 2026-11-26T00:00:00Z
reason = "Linux-only transitive dependency of Tauri 2.12 (gtk 0.18); not in the Windows build; no fix without a Tauri upgrade"

[[IgnoredVulns]]
id = "GHSA-wrw7-89jp-8q8g"
ignoreUntil = 2026-11-26T00:00:00Z
reason = "Alias of RUSTSEC-2024-0429 (glib 0.18); see above"

