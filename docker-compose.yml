services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-airtime}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-airtime}
      POSTGRES_DB: ${POSTGRES_DB:-airtime}
    volumes:
      - airtime-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-airtime} -d ${POSTGRES_DB:-airtime}"]
      interval: 5s
      timeout: 5s
      retries: 12

  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      DATABASE_URL: postgres://${POSTGRES_USER:-airtime}:${POSTGRES_PASSWORD:-airtime}@postgres:5432/${POSTGRES_DB:-airtime}
      APP_JWT_SECRET: ${APP_JWT_SECRET:-change-me-in-production}
      COOKIE_SECRET: ${COOKIE_SECRET:-change-me-in-production}
      TOKEN_ENCRYPTION_KEY: ${TOKEN_ENCRYPTION_KEY:-}
      SYNC_POLL_SECONDS: ${SYNC_POLL_SECONDS:-60}
      SYNC_POLL_ENABLED: ${SYNC_POLL_ENABLED:-true}
      BOOTSTRAP_ORG_NAME: ${BOOTSTRAP_ORG_NAME:-Airtime}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-admin@example.com}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-change-me-in-production}
      BOOTSTRAP_ADMIN_NAME: ${BOOTSTRAP_ADMIN_NAME:-Administrator}
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_REDIRECT_URI: ${OIDC_REDIRECT_URI:-}
      BASE_URL: ${BASE_URL:-http://localhost:3000}
    ports:
      - "${AIR_TIME_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

volumes:
  airtime-pgdata:
